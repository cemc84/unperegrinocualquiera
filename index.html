<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un Peregrino Cualquiera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b0b;color:white;font-family:Arial,sans-serif}
.hero{
height:100vh;
background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url('fondoWeb2.png');
background-size:cover;background-position:center;
display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
}
.section{padding:80px 10%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:#161616;padding:25px;border-radius:18px}
.card h3{color:#f5b400;margin-bottom:10px}
a.merch{color:#f5b400;text-decoration:none}
</style>
</head>
<body>
<section class="hero"></section>

<section class="section">
<div class="cards">
<div class="card">
<h3>Caminos de Santiago</h3>
<p>Todos los Domingos a las 19:15 una nueva etapa.</p>
</div>

<div class="card">
<h3>Extras</h3>
<p>Cada Miércoles a las 19:15 un nuevo vídeo con consejos y ayudas extra.</p>
</div>

<div class="card">
<h3><a class="merch" href="https://www.toguapa.com" target="_blank">Merchandising</a></h3>
<p>Camisetas, sudaderas y mucho más.</p>
</div>
</div>
</section>
</body>
</html>
